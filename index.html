<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alex Barrett</title>
<meta name="description" content="Alex Barrett — from Vancouver, Canada, now living in New York City.">
<link rel="canonical" href="https://alexetcetc.github.io/">

<!-- Open Graph: how this page looks when shared as a link (iMessage, Slack, etc.) -->
<meta property="og:title" content="Alex Barrett">
<meta property="og:description" content="From Vancouver, Canada, now living in New York City.">
<meta property="og:url" content="https://alexetcetc.github.io/">
<meta property="og:type" content="profile">

<!-- Tells search engines this page represents a specific person, not
     just a page that mentions one. Doesn't guarantee ranking, but it's
     the clearest signal a static page can give. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Alex Barrett",
  "url": "https://alexetcetc.github.io/",
  "homeLocation": [
    { "@type": "Place", "name": "Vancouver, Canada" },
    { "@type": "Place", "name": "New York City, New York" }
  ],
  "sameAs": [
    "https://github.com/alexetcetc"
  ]
}
</script>

<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<h1>hello</h1>

<p>i'm alex barrett.</p>

<p>i grew up in vancouver, canada. i live in the upper west side of new york city.</p>

<p>i really enjoy <button type="button" class="contact-trigger" id="open-contact">hearing from</button> people i used to know or haven't talked to in a while.</p>

<dialog id="contact">
  <form id="contact-form" action="https://formspree.io/f/xrpgvndr" method="POST">
    <label>
      Your email (optional)
      <input type="email" name="email">
    </label>
    <label>
      Message
      <textarea name="message" required cols="60"></textarea>
    </label>
    <p id="contact-status" role="status" hidden></p>
    <div class="actions">
      <button type="button" id="cancel-contact">Cancel</button>
      <button type="submit">Send</button>
    </div>
  </form>
</dialog>

<script>
  const dialog = document.getElementById("contact");
  const form = document.getElementById("contact-form");
  const status = document.getElementById("contact-status");

  document.getElementById("open-contact").addEventListener("click", () => dialog.showModal());
  document.getElementById("cancel-contact").addEventListener("click", () => dialog.close());

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitButton = form.querySelector('button[type="submit"]');
    submitButton.disabled = true;
    status.hidden = true;

    try {
      const response = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { Accept: "application/json" },
      });

      if (response.ok) {
        form.reset();
        status.textContent = "Sent — thanks.";
        status.hidden = false;
        setTimeout(() => dialog.close(), 1200);
      } else {
        status.textContent = "Something went wrong — try again, or email directly.";
        status.hidden = false;
      }
    } catch {
      status.textContent = "Couldn't reach the server — check your connection and try again.";
      status.hidden = false;
    } finally {
      submitButton.disabled = false;
    }
  });
</script>
</body>
</html>
